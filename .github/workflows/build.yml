name: Build Elden kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo git python3 zip unzip rsync bc flex bison build-essential libssl-dev libelf-dev zlib1g-dev zstd openssl
      - name: Build AVB-signed boot and AnyKernel3 package
        run: ./build-bakasu-elden.sh
      - uses: actions/upload-artifact@v6
        with:
          name: elden-kernel
          path: out/
          if-no-files-found: error
